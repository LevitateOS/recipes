name: Validate Recipes

on: [push, pull_request]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-action@stable

      - name: Build recipe tool
        run: |
          git clone --depth 1 https://github.com/LevitateOS/levitateos /tmp/levitateos
          cd /tmp/levitateos/recipe
          cargo build --release
          sudo cp target/release/recipe /usr/local/bin/

      - name: Validate all recipes
        run: |
          for f in *.recipe; do
            echo "Validating ${f}..."
            recipe info "${f%.recipe}" --recipe-dir .
          done
